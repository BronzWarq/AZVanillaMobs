---
# AZVanillaMobs Configuration

# World values may stay as the old dimension strings or use a dimension/profile pair.
worlds:
  "world": {dimension: "overworld", profile: "survival"}
  "skyblock": {dimension: "overworld", profile: "sparse"}
  "normal": {dimension: "overworld", profile: "survival"}
  "nether": {dimension: "nether", profile: "survival"}
  "the_end": {dimension: "the_end", profile: "survival"}

# Global cap for maximum mobs allowed on the server at once
global-mob-cap: 200

# Optional melee damage overrides. Omit a mob to use its built-in value.
# Example: zombie: 3, irongolem: 15 (keys are lowercase class names).
combat-damage: {}

# Cap for maximum mobs allowed per world
per-world-mob-cap: 70

# A player becomes eligible for natural phantom attacks after this many full
# in-game days without sleeping. New players start counting from their first join.
phantom-sleep:
  nights-without-sleep: 3

# Profiles control natural spawning separately for each configured world.
# Existing world entries such as "world: overworld" continue to use "default".
spawn-profiles:
  survival:
    interval-seconds: 5
    attempts-per-player: 1
    max-attempts-per-cycle: 40
    min-player-distance: 24
    max-player-distance: 48
    per-world-mob-cap: 70
    natural-hostile-despawn-distance: 128
    categories: [hostile, passive, aquatic]
    disabled-mobs: []
    mob-weights:
      zombie: 10
      skeleton: 10
      creeper: 6
      spider: 8
      witch: 2
      enderman: 2
      phantom: 2
      warden: 0
      elderguardian: 0
      enderdragon: 0
      evoker: 0
      vindicator: 0
      pillager: 0
      ravager: 0
      vex: 0
      villager: 0
      irongolem: 0
      snowgolem: 0
      wanderingtrader: 0
      allay: 0
      sniffer: 0
    mob-biomes:
      husk: [desert, "badlands*"]
      stray: ["snowy_*", "frozen_*", ice_spikes, grove, jagged_peaks]
      camel: [desert]
      ocelot: [jungle, bamboo_jungle, sparse_jungle]
      panda: [jungle, bamboo_jungle]
      fox: [taiga, "*taiga", grove, snowy_plains]
      goat: [stony_peaks, snowy_slopes, frozen_peaks, jagged_peaks]
      frog: [swamp, mangrove_swamp]
      slime: [swamp, mangrove_swamp]
    rare-encounters:
      enabled: false
      chance: 0.01
      max-per-world: 2
      health-multiplier: 1.5
      damage-multiplier: 1.15
      visible-name: true
      bonus-drop:
        item: diamond
        amount: 1
        chance: 0.1
  sparse:
    interval-seconds: 8
    attempts-per-player: 1
    max-attempts-per-cycle: 20
    min-player-distance: 24
    max-player-distance: 48
    per-world-mob-cap: 35
    natural-hostile-despawn-distance: 128
    categories: [hostile, passive, aquatic]
    disabled-mobs: []
    mob-weights: {}
    mob-biomes: {}
    rare-encounters:
      enabled: false

# Entity type limits (max number of specific mob types can spawn)
entity-type-limits:
  # Passive animals
  cow: 30
  pig: 25
  sheep: 25
  chicken: 40
  horse: 15
  donkey: 10
  mule: 10
  llama: 15
  traderllama: 8
  wolf: 20
  cat: 15
  ocelot: 10
  panda: 10
  fox: 15
  goat: 15
  bat: 20
  
  # Aquatic
  squid: 20
  glowsquid: 15
  dolphin: 10
  axolotl: 15
  turtle: 10
  cod: 20
  salmon: 20
  pufferfish: 15
  tropicalfish: 25
  tadpole: 30
  
  # Passive special
  villager: 15
  wanderingtrader: 3
  irongolem: 5
  snowgolem: 10
  allay: 10
  bee: 20
  frog: 15
  sniffer: 8
  camel: 10
  
  # Overworld Hostile
  zombie: 20
  skeleton: 15
  creeper: 15
  spider: 15
  cavespider: 10
  slime: 8
  silverfish: 5
  witch: 8
  zombievillager: 10
  drowned: 10
  husk: 12
  stray: 12
  phantom: 10
  enderman: 12
  vindicator: 8
  evoker: 5
  pillager: 8
  ravager: 3
  vex: 10
  guardian: 8
  elderguardian: 2
  
  # Nether
  zombifiedpiglin: 15
  piglin: 15
  piglinbrute: 8
  blaze: 10
  ghast: 8
  magmacube: 12
  witherskeleton: 10
  hoglin: 10
  zoglin: 8
  strider: 12
  
  # The End
  shulker: 8
  endermite: 15
